<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Eamon: The Second Age</title>
  <link rel="stylesheet" href="https://use.typekit.net/pdm8wtv.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050404;
      --surface: #0c0a08;
      --border: rgba(255,255,255,0.07);
      --gold: #c8a84b;
      --gold-dim: rgba(200,168,75,0.4);
      --gold-glow: rgba(200,168,75,0.15);
      --text: #d4cfc4;
      --text-dim: rgba(212,207,196,0.45);
      --action: #e8c65a;
      --font-head: "cinder", sans-serif;
      --font-body: "Crimson Text", Georgia, serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; }

    /* ═══ TITLE SCREEN ═══ */
    #title-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
      background: var(--bg); gap: 32px; transition: opacity 1.2s ease;
    }
    #title-screen.fade-out { opacity: 0; pointer-events: none; }
    .title-dragon {
      width: 280px; height: 340px;
      background: url('dragon-v2.jpg') center center / contain no-repeat;
      filter: drop-shadow(0 0 40px rgba(200,168,75,0.15));
      animation: dragonBreathe 5s ease-in-out infinite;
    }
    @keyframes dragonBreathe { 
      0%,100%{filter: drop-shadow(0 0 30px rgba(200,168,75,0.1)); transform: scale(1);} 
      50%{filter: drop-shadow(0 0 60px rgba(200,168,75,0.2)); transform: scale(1.02);} 
    }
    @keyframes breathe { 0%,100%{box-shadow:0 0 20px rgba(200,168,75,0.1)} 50%{box-shadow:0 0 40px rgba(200,168,75,0.25),0 0 80px rgba(200,168,75,0.08)} }
    .title-main { font-family: var(--font-head); font-size: clamp(2.8rem,8vw,5rem); font-weight: 400; color: var(--gold); letter-spacing: 0.12em; text-align: center; line-height: 1; }
    .title-sub { font-family: var(--font-head); font-style: normal; color: #8b6914; font-size: clamp(1.4rem, 4vw, 2.2rem); letter-spacing: 0.18em; text-transform: uppercase; }
    .enter-btn { margin-top: 16px; padding: 14px 56px; font-family: var(--font-head); font-size: 1rem; letter-spacing: 0.15em; color: var(--gold); background: transparent; border: 1px solid var(--gold-dim); border-radius: 2px; cursor: pointer; transition: all 0.3s; }
    .enter-btn:hover { background: rgba(200,168,75,0.06); border-color: var(--gold); box-shadow: 0 0 30px rgba(200,168,75,0.12); }

    /* ═══ GAME SCREEN ═══ */
    #game-screen { position: fixed; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 1.2s ease; }
    #game-screen.active { opacity: 1; pointer-events: all; }

    #scene-bg { position: absolute; inset: 0; z-index: 0; background: url('scenes/great-hall.jpg') center top / cover no-repeat, var(--bg); transition: opacity 1.5s ease; }
    #scene-bg-next { position: absolute; inset: 0; z-index: 0; background: center top / cover no-repeat var(--bg); opacity: 0; transition: opacity 1.5s ease; }
    #scene-bg::after, #scene-bg-next::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(5,4,4,0.15) 0%, rgba(5,4,4,0.1) 20%, rgba(5,4,4,0.6) 55%, rgba(5,4,4,0.97) 100%); }
    /* Portrait panel */
    #portrait-frame { position: absolute; bottom: 200px; right: 20px; z-index: 5; width: 140px; height: 170px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; opacity: 0; transform: translateX(30px); transition: opacity 0.6s ease, transform 0.6s ease; background: var(--bg); }
    #portrait-frame.visible { opacity: 1; transform: translateX(0); }
    #portrait-frame img { width: 100%; height: 130px; object-fit: cover; }
    #portrait-name { padding: 4px 8px; font-family: var(--font-head); font-size: 0.65rem; color: var(--gold); text-align: center; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #portrait-stats { padding: 0 8px 4px; font-size: 0.55rem; color: var(--text-dim); text-align: center; }
    /* Generating indicator */
    .img-generating { position: absolute; top: 50%; left: 50%; z-index: 2; transform: translate(-50%,-50%); font-family: var(--font-head); font-size: 0.7rem; letter-spacing: 0.15em; color: var(--gold-dim); opacity: 0; transition: opacity 0.5s; pointer-events: none; }
    .img-generating.active { opacity: 1; }
    #grain { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E"); background-repeat: repeat; background-size: 128px; animation: grainShift 0.5s steps(1) infinite; }
    @keyframes grainShift { 0%{background-position:0 0}20%{background-position:-30px 10px}40%{background-position:10px -20px}60%{background-position:-20px -10px}80%{background-position:30px 20px}100%{background-position:0 0} }

    /* ── HUD (top bar) ── */
    #hud {
      position: relative; z-index: 10; display: flex; align-items: center;
      justify-content: space-between; padding: 10px 28px;
      background: rgba(5,4,4,0.85); border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px); flex-shrink: 0;
    }
    #hud-name { font-family: var(--font-head); font-size: 1rem; color: var(--gold); letter-spacing: 0.06em; }
    #hud-stats { display: flex; gap: 20px; }
    .hud-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .hud-stat-label { font-size: 0.55rem; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; }
    .hud-stat-val { font-size: 0.9rem; color: var(--text); font-weight: 600; }
    .hud-controls { display: flex; gap: 8px; }
    .hud-btn { background: none; border: 1px solid var(--border); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; color: var(--text-dim); font-size: 0.8rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .hud-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
    .hud-btn.active { border-color: var(--gold); color: var(--gold); }

    /* ── Location Title (below HUD, inside scene) ── */
    #location-title {
      position: relative; z-index: 15;
      text-align: center; padding: 20px 28px 8px;
      font-family: var(--font-head);
      font-size: clamp(2rem, 5.5vw, 3.2rem);
      color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase;
      text-shadow: 0 0 50px rgba(200,168,75,0.3), 0 2px 12px rgba(0,0,0,0.9);
      opacity: 0; transition: opacity 0.8s ease;
    }
    #location-title.visible { opacity: 1; }
    @keyframes titleReveal { from { opacity: 0; letter-spacing: 0.35em; } to { opacity: 1; letter-spacing: 0.2em; } }
    #location-title.reveal { animation: titleReveal 1s ease-out forwards; }

    /* ── Narrative ── */
    #narrative-area {
      position: relative; z-index: 5; flex: 1; display: flex;
      flex-direction: column; justify-content: flex-end;
      padding: 0 clamp(20px,5vw,80px) 0; overflow: hidden;
    }
    #narrative-scroll { max-height: 40vh; overflow-y: auto; scrollbar-width: none; }
    #narrative-scroll::-webkit-scrollbar { display: none; }
    .narrative-line { font-size: clamp(1.05rem,2.2vw,1.3rem); line-height: 1.8; color: var(--text); margin-bottom: 12px; max-width: 700px; }
    .narrative-line.player-line { color: var(--gold); font-style: italic; font-size: 0.95em; margin-bottom: 16px; opacity: 0.8; }
    .narrative-line.player-line::before { content: '› '; color: var(--gold-dim); }

    /* Action highlight — bold gold text for commands/questions */
    .action-highlight {
      color: var(--action); font-weight: 600;
      text-shadow: 0 0 8px rgba(232,198,90,0.2);
    }

    .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--gold); margin-left: 2px; vertical-align: text-bottom; animation: blink 0.7s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes lineIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .line-enter { animation: lineIn 0.4s ease-out forwards; }

    /* ── Choices ── */
    #choices-area {
      position: relative; z-index: 10; display: none; flex-wrap: wrap; gap: 8px;
      padding: 8px clamp(20px,5vw,80px) 12px; max-width: 780px;
    }
    #choices-area.visible { display: flex; animation: lineIn 0.5s ease-out; }
    .choice-card {
      padding: 10px 20px; background: rgba(200,168,75,0.04);
      border: 1px solid var(--gold-dim); border-radius: 3px; cursor: pointer;
      font-family: var(--font-body); font-size: 0.95rem; color: var(--gold);
      transition: all 0.25s; letter-spacing: 0.02em;
    }
    .choice-card:hover { background: rgba(200,168,75,0.1); border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow); transform: translateY(-1px); }

    /* ── Thinking ── */
    #thinking { display: none; align-items: center; gap: 8px; padding: 8px clamp(20px,5vw,80px) 4px; color: var(--text-dim); font-style: italic; font-size: 0.9rem; }
    .think-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold-dim); animation: thinkPulse 1.4s ease-in-out infinite; }
    .think-dot:nth-child(2) { animation-delay: 0.2s; }
    .think-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes thinkPulse { 0%,80%,100%{transform:scale(0.6);opacity:0.3} 40%{transform:scale(1.2);opacity:1} }

    /* ═══ INPUT ZONE ═══ */
    #input-zone { position: relative; z-index: 10; padding: 0 clamp(20px,5vw,80px) 28px; }

    #input-label {
      font-family: var(--font-head);
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      letter-spacing: 0.12em;
      color: var(--gold); text-transform: uppercase;
      margin-bottom: 12px; padding-left: 2px;
      opacity: 0; transition: opacity 0.5s ease;
      text-shadow: 0 0 20px rgba(200,168,75,0.2);
    }
    #input-label.visible { opacity: 1; }

    #input-box {
      display: flex; align-items: center; gap: 12px; max-width: 700px;
      padding: 16px 20px; background: rgba(12,10,8,0.85);
      border: 1px solid var(--border); border-radius: 4px;
      backdrop-filter: blur(12px); transition: border-color 0.3s, box-shadow 0.3s;
    }
    #input-box.glow { border-color: var(--gold-dim); box-shadow: 0 0 20px var(--gold-glow), 0 0 60px rgba(200,168,75,0.05); }
    #input-box:focus-within { border-color: var(--gold); box-shadow: 0 0 24px var(--gold-glow); }
    #input-box.skin-name { border-color: rgba(200,168,75,0.5); background: rgba(40,30,15,0.9); }
    #input-box.skin-shop { border-color: rgba(120,100,60,0.5); background: rgba(30,25,15,0.9); }

    #prompt-arrow { color: var(--gold); font-family: var(--font-head); font-size: 1.2rem; flex-shrink: 0; }
    #player-input { flex: 1; background: transparent; border: none; outline: none; font-family: var(--font-body); font-size: clamp(1.05rem,2vw,1.2rem); color: var(--text); caret-color: var(--gold); letter-spacing: 0.01em; }
    #player-input::placeholder { color: var(--text-dim); font-style: italic; }
    #send-btn { flex-shrink: 0; background: none; border: 1px solid var(--border); border-radius: 2px; padding: 8px 20px; font-family: var(--font-head); font-size: 0.8rem; letter-spacing: 0.1em; color: var(--text-dim); cursor: pointer; transition: all 0.2s; }
    #send-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    @keyframes inputPulse { 0%,100%{box-shadow:0 0 20px var(--gold-glow)} 50%{box-shadow:0 0 35px rgba(200,168,75,0.2),0 0 70px rgba(200,168,75,0.06)} }
    #input-box.pulse { border-color: var(--gold-dim); animation: inputPulse 2.5s ease-in-out infinite; }

    @keyframes statPop { 0%{transform:scale(0.5);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
    .stat-reveal { animation: statPop 0.4s ease-out forwards; }

    /* ═══ SHOP PANEL ═══ */
    #shop-panel {
      position: fixed; top: 0; right: -380px; width: 360px; height: 100%; z-index: 50;
      background: rgba(8,6,4,0.96); border-left: 1px solid var(--gold-dim);
      backdrop-filter: blur(16px); transition: right 0.4s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #shop-panel.open { right: 0; }
    .shop-header {
      padding: 20px 24px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .shop-title { font-family: var(--font-head); font-size: 1.3rem; color: var(--gold); letter-spacing: 0.1em; }
    .shop-close { background: none; border: 1px solid var(--border); border-radius: 50%; width: 28px; height: 28px; cursor: pointer; color: var(--text-dim); font-size: 0.9rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .shop-close:hover { border-color: var(--gold-dim); color: var(--gold); }
    .shop-gold { padding: 8px 24px; font-size: 0.85rem; color: var(--gold); border-bottom: 1px solid var(--border); }
    .shop-items { flex: 1; overflow-y: auto; padding: 8px 0; scrollbar-width: thin; scrollbar-color: var(--gold-dim) transparent; }
    .shop-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .shop-item:hover { background: rgba(200,168,75,0.06); }
    .shop-item-info { flex: 1; }
    .shop-item-name { font-size: 1rem; color: var(--text); margin-bottom: 2px; }
    .shop-item-desc { font-size: 0.8rem; color: var(--text-dim); font-style: italic; }
    .shop-item-stats { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
    .shop-stat { font-size: 0.72rem; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .shop-stat-val { color: var(--gold); font-weight: 600; }
    .shop-stat.stat-positive .shop-stat-val { color: #8fbc6a; }
    .shop-stat.stat-negative .shop-stat-val { color: #c46a5a; }
    .shop-item-price { font-family: var(--font-head); font-size: 0.95rem; color: var(--gold); white-space: nowrap; margin-left: 16px; }
    .shop-item.cant-afford { opacity: 0.4; cursor: not-allowed; }
    .shop-item.cant-afford:hover { background: transparent; }
    .shop-category {
      padding: 14px 24px 6px; font-family: var(--font-head); font-size: 0.8rem;
      color: var(--gold-dim); letter-spacing: 0.15em; text-transform: uppercase;
      border-top: 1px solid var(--border); margin-top: 4px;
    }
    .shop-category:first-child { border-top: none; margin-top: 0; }
    @keyframes shopSlide { from { right: -380px; } to { right: 0; } }

    @media (max-width: 640px) {
      #shop-panel { width: 100%; right: -100%; }
    }
      #hud-stats { gap: 14px; }
      .hud-stat-val { font-size: 0.85rem; }
      #input-box { padding: 12px 16px; }
      .choice-card { padding: 8px 14px; font-size: 0.9rem; }
      #location-title { padding: 14px 20px 6px; }
    }
  </style>
</head>
<body>

<!-- ═ TITLE ═ -->
<div id="title-screen">
  <div class="title-dragon"></div>
  <h1 class="title-main">EAMON</h1>
  <p class="title-sub">THE SECOND AGE</p>
  <button class="enter-btn" id="enter-btn">ENTER THE HALL</button>
</div>

<!-- ═ GAME ═ -->
<div id="game-screen">
  <div id="scene-bg"></div>
  <div id="scene-bg-next"></div>
  <div class="img-generating" id="img-generating">◈ CONJURING VISION ◈</div>
  <div id="portrait-frame">
    <img id="portrait-img" src="" alt="">
    <div id="portrait-name"></div>
    <div id="portrait-stats"></div>
  </div>
  <div id="grain"></div>

  <div id="hud">
    <div id="hud-name">—</div>
    <div id="hud-stats">
      <div class="hud-stat"><span class="hud-stat-label">HD</span><span class="hud-stat-val" id="stat-hd">—</span></div>
      <div class="hud-stat"><span class="hud-stat-label">AG</span><span class="hud-stat-val" id="stat-ag">—</span></div>
      <div class="hud-stat"><span class="hud-stat-label">CH</span><span class="hud-stat-val" id="stat-ch">—</span></div>
      <div class="hud-stat"><span class="hud-stat-label">GOLD</span><span class="hud-stat-val" id="stat-gold" style="color:var(--gold)">—</span></div>
    </div>
    <div class="hud-controls">
      <button class="hud-btn active" id="hud-music-btn" title="Toggle music">🎵</button>
      <button class="hud-btn active" id="hud-voice-btn" title="Toggle voice">🔊</button>
    </div>
  </div>

  <div id="location-title"></div>

  <div id="narrative-area">
    <div id="narrative-scroll"></div>
  </div>

  <div id="thinking">
    <div class="think-dot"></div><div class="think-dot"></div><div class="think-dot"></div>
  </div>

  <!-- ═ SHOP PANEL ═ -->
  <div id="shop-panel">
    <div class="shop-header">
      <span class="shop-title" id="shop-title">SHOP</span>
      <button class="shop-close" id="shop-close-btn">&times;</button>
    </div>
    <div class="shop-gold" id="shop-gold">Your gold: —</div>
    <div class="shop-items" id="shop-items"></div>
  </div>

  <div id="choices-area" style="margin-bottom:2vh"></div>

  <div id="input-zone" style="margin-bottom:10vh">
    <div id="input-label"></div>
    <div id="input-box" style="min-height:56px;padding:14px 20px">
      <span id="prompt-arrow" style="font-size:1.3rem">›</span>
      <input type="text" id="player-input" placeholder="" autocomplete="off" spellcheck="false" disabled style="font-size:1.15rem">
      <button id="send-btn" disabled style="font-size:1.05rem;padding:10px 22px">SEND</button>
    </div>
  </div>
</div>

<script>
const SESSION_ID = 'eamon-' + Math.random().toString(36).slice(2, 10);

// ── Shop Data ──
const SHOP_DATA = {
  marcos: {
    title: "MARCOS CAVIELLI'S WEAPONS",
    items: [
      { name: 'Short Sword', desc: 'Reliable and light', price: 30, stats: { dmg: '1d6', odds: '25%', type: 'Sword' } },
      { name: 'Broadsword', desc: 'Standard warrior\'s blade', price: 60, stats: { dmg: '2d6', odds: '30%', type: 'Sword' } },
      { name: 'Battle Axe', desc: 'Heavy, devastating swings', price: 80, stats: { dmg: '2d8', odds: '20%', type: 'Axe' } },
      { name: 'Mace', desc: 'Crushes armor and bone', price: 50, stats: { dmg: '2d4', odds: '30%', type: 'Mace' } },
      { name: 'Spear', desc: 'Reach advantage in combat', price: 40, stats: { dmg: '1d8', odds: '25%', type: 'Spear' } },
      { name: 'War Hammer', desc: 'Slow but lethal', price: 90, stats: { dmg: '3d6', odds: '15%', type: 'Hammer' } },
      { name: 'Leather Armor', desc: 'Basic protection', price: 50, stats: { def: '+2', weight: 'Light', type: 'Armor' } },
      { name: 'Chain Mail', desc: 'Solid defense, some weight', price: 120, stats: { def: '+5', weight: 'Medium', ag: '-1', type: 'Armor' } },
      { name: 'Plate Armor', desc: 'Heavy but near-impervious', price: 200, stats: { def: '+8', weight: 'Heavy', ag: '-3', type: 'Armor' } },
      { name: 'Shield', desc: 'Blocks incoming strikes', price: 40, stats: { def: '+2', block: '15%', type: 'Shield' } },
    ]
  },
  hokas: {
    title: "HOKAS TOKAS' MAGIC EMPORIUM",
    items: [
      { name: 'Blast Spell', desc: 'Deals magical damage', price: 100, stats: { dmg: '2d8', range: 'Ranged', type: 'Spell' } },
      { name: 'Heal Spell', desc: 'Restore lost Hardiness', price: 80, stats: { heal: '2d6', uses: '3/adventure', type: 'Spell' } },
      { name: 'Speed Spell', desc: 'Boost Agility in combat', price: 120, stats: { buff: 'AG +5', dur: '3 rounds', type: 'Spell' } },
      { name: 'Power Spell', desc: 'Random powerful effect', price: 150, stats: { effect: 'Random', power: 'High', type: 'Spell' } },
      { name: 'Healing Potion', desc: 'One-use, restores 10 HD', price: 25, stats: { heal: '+10 HD', uses: '1 (consumed)', type: 'Potion' } },
      { name: 'Scroll of Protection', desc: 'Reduces damage taken', price: 60, stats: { def: '+3', dur: '5 rounds', uses: '1 (consumed)', type: 'Scroll' } },
    ]
  },
  bank: {
    title: "SHYLOCK McFENNEY'S BANK",
    items: [
      { name: 'Deposit 50 Gold', desc: 'Safe keeping', price: 0 },
      { name: 'Deposit 100 Gold', desc: 'Safe keeping', price: 0 },
      { name: 'Withdraw 50 Gold', desc: 'From your account', price: 0 },
      { name: 'Withdraw 100 Gold', desc: 'From your account', price: 0 },
    ]
  },
  pawn: {
    title: "SAM SLICKER'S PAWN SHOP",
    items: [
      { name: 'Sell your loot here', desc: 'Prices vary by item', price: 0 },
    ]
  },
};

// Shop-to-location mapping for background generation
const SHOP_LOCATIONS = {
  marcos: "Marcos Cavielli's Weapon Shop — racks of swords and axes on stone walls, anvil, forge glow",
  hokas: "Hokas Tokas' Magic Emporium — shelves of potions, glowing crystals, arcane tomes, purple mist",
  bank: "Shylock McFenney's Bank — gold stacks, iron vault doors, counting tables, candlelight",
  pawn: "Sam Slicker's Pawn Shop — cluttered shelves of adventuring gear, dusty treasures, dim lanterns"
};

function openShop(shopKey) {
  const shop = SHOP_DATA[shopKey];
  if (!shop) return;
  // Generate shop-specific background
  const shopLocation = SHOP_LOCATIONS[shopKey];
  if (shopLocation && shopLocation !== lastBgLocation) {
    lastBgLocation = shopLocation;
    generateSceneBg(shopLocation);
  }
  const panel = document.getElementById('shop-panel');
  document.getElementById('shop-title').textContent = shop.title;
  document.getElementById('shop-title').dataset.shopKey = shopKey;
  document.getElementById('shop-gold').textContent = `Your gold: ${character.gold || 0}`;
  const container = document.getElementById('shop-items');
  container.innerHTML = '';
  // Group items by category
  const groups = {};
  for (const item of shop.items) {
    const cat = (item.stats && item.stats.type) || 'General';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(item);
  }
  const categoryOrder = ['Sword', 'Axe', 'Mace', 'Spear', 'Hammer', 'Armor', 'Shield', 'Spell', 'Potion', 'Scroll', 'General'];
  const sortedCats = Object.keys(groups).sort((a, b) => {
    const ai = categoryOrder.indexOf(a), bi = categoryOrder.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });
  // Only show category headers if more than one category
  const showHeaders = sortedCats.length > 1;
  let lastHeaderLabel = '';
  for (const cat of sortedCats) {
    if (showHeaders) {
      // Merge weapon subtypes under one header, shield under armor
      const weaponTypes = ['Sword', 'Axe', 'Mace', 'Spear', 'Hammer'];
      const armorTypes = ['Armor', 'Shield'];
      const headerLabel = weaponTypes.includes(cat) ? '⚔ WEAPONS' : armorTypes.includes(cat) ? '🛡 ARMOR & SHIELDS' : cat === 'Spell' ? '✦ SPELLS' : cat === 'Potion' ? '🧪 POTIONS' : cat === 'Scroll' ? '📜 SCROLLS' : cat;
      // Avoid duplicate headers
      if (headerLabel !== lastHeaderLabel) {
        const hdr = document.createElement('div');
        hdr.className = 'shop-category';
        hdr.textContent = headerLabel;
        container.appendChild(hdr);
        lastHeaderLabel = headerLabel;
      }
    }
    for (const item of groups[cat]) {
    const canAfford = item.price === 0 || (character.gold || 0) >= item.price;
    const div = document.createElement('div');
    div.className = 'shop-item' + (canAfford ? '' : ' cant-afford');
    let statsHtml = '';
    if (item.stats) {
      const statEntries = Object.entries(item.stats).filter(([k]) => k !== 'type');
      statsHtml = '<div class="shop-item-stats">' + statEntries.map(([k, v]) => {
        const label = k === 'dmg' ? 'DMG' : k === 'def' ? 'DEF' : k === 'odds' ? 'HIT' : k === 'heal' ? 'HEAL' : k === 'buff' ? 'BUFF' : k === 'block' ? 'BLOCK' : k === 'dur' ? 'DUR' : k === 'uses' ? 'USES' : k === 'range' ? 'RNG' : k === 'effect' ? 'FX' : k === 'power' ? 'PWR' : k === 'weight' ? 'WT' : k === 'ag' ? 'AG' : k.toUpperCase();
        const cls = String(v).startsWith('+') ? 'stat-positive' : String(v).startsWith('-') ? 'stat-negative' : '';
        return `<span class="shop-stat ${cls}">${label} <span class="shop-stat-val">${v}</span></span>`;
      }).join('') + '</div>';
      statsHtml = `<div class="shop-item-type" style="font-size:0.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;">${item.stats.type || ''}</div>` + statsHtml;
    }
    div.innerHTML = `
      <div class="shop-item-info">
        <div class="shop-item-name">${item.name}</div>
        <div class="shop-item-desc">${item.desc}</div>
        ${statsHtml}
      </div>
      <div class="shop-item-price">${item.price > 0 ? item.price + ' gold' : '—'}</div>
    `;
    if (canAfford && item.price > 0) {
      div.addEventListener('click', () => {
        // Debit gold client-side immediately
        character.gold = (character.gold || 0) - item.price;
        document.getElementById('stat-gold').textContent = character.gold;
        document.getElementById('shop-gold').textContent = `Your gold: ${character.gold}`;
        // Add to inventory tracking
        if (!character.inventory) character.inventory = [];
        character.inventory.push({ name: item.name, stats: item.stats });
        // Re-render shop to update afford states
        const currentShopKey = document.getElementById('shop-title').dataset.shopKey;
        // Send buy command to AI
        inputEl.value = `Buy ${item.name}`;
        sendMessage();
        // Refresh shop panel after short delay to update can-afford styling
        setTimeout(() => { if (currentShopKey) openShop(currentShopKey); }, 300);
      });
    }
    container.appendChild(div);
  } // end items in category
  } // end categories
  panel.classList.add('open');
}
function closeShop() { document.getElementById('shop-panel').classList.remove('open'); }
document.getElementById('shop-close-btn').addEventListener('click', closeShop);
let voiceEnabled = true;
let musicEnabled = true;
let isStreaming = false;
let gamePhase = 'intro';
let character = {};
let currentVoiceId = null;

// ── Music ──
const hallMusic = new Audio('concrete-omen.mp3');
hallMusic.loop = true; hallMusic.volume = 0;
const adventureMusic = new Audio('lead-drip-psalm.mp3');
adventureMusic.loop = true; adventureMusic.volume = 0;
let bgMusic = hallMusic; // start with hall music

function switchMusic(track) {
  if (bgMusic === track) return;
  const oldMusic = bgMusic;
  bgMusic = track;
  // Crossfade
  const fadeOut = setInterval(() => {
    oldMusic.volume = Math.max(0, oldMusic.volume - 0.02);
    if (oldMusic.volume <= 0) { oldMusic.pause(); clearInterval(fadeOut); }
  }, 50);
  if (musicEnabled) {
    track.volume = 0;
    track.play().catch(()=>{});
    let vol2 = 0;
    const fadeIn = setInterval(() => {
      vol2 = Math.min(vol2 + 0.008, 0.3);
      track.volume = vol2;
      if (vol2 >= 0.3) clearInterval(fadeIn);
    }, 50);
  }
}
function startMusic() {
  if (!musicEnabled) return;
  bgMusic.play().catch(()=>{});
  let vol = 0;
  const fade = setInterval(() => { vol = Math.min(vol + 0.008, 0.3); bgMusic.volume = vol; if (vol >= 0.3) clearInterval(fade); }, 50);
}
document.getElementById('hud-music-btn').addEventListener('click', () => {
  musicEnabled = !musicEnabled;
  const btn = document.getElementById('hud-music-btn');
  btn.classList.toggle('active', musicEnabled);
  btn.textContent = musicEnabled ? '🎵' : '🔇';
  if (musicEnabled) { bgMusic.play().catch(()=>{}); bgMusic.volume = 0.3; } else { hallMusic.pause(); adventureMusic.pause(); }
});

// ── Voice (ElevenLabs) ──
let ttsAudio = null;
function speakBrowserTTS(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.88; utter.pitch = 0.85; utter.volume = 0.9;
  // Try to pick a deep male voice
  const voices = window.speechSynthesis.getVoices();
  const pref = voices.find(v => /daniel|james|thomas|aaron/i.test(v.name) && /en/i.test(v.lang))
    || voices.find(v => /male/i.test(v.name) && /en/i.test(v.lang))
    || voices.find(v => /en-/i.test(v.lang));
  if (pref) utter.voice = pref;
  window.speechSynthesis.speak(utter);
}
// Preload voices
if ('speechSynthesis' in window) window.speechSynthesis.getVoices();

async function speakElevenLabs(text, voiceId) {
  if (!voiceEnabled || !text) return;
  try {
    if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
    const res = await fetch('/api/tts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voiceId }),
    });
    if (!res.ok) {
      console.warn('ElevenLabs failed, falling back to browser TTS');
      speakBrowserTTS(text);
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    ttsAudio = new Audio(url);
    ttsAudio.volume = 0.9;
    ttsAudio.play().catch(()=>{});
    ttsAudio.onended = () => { URL.revokeObjectURL(url); ttsAudio = null; };
  } catch (e) {
    console.warn('TTS error, falling back to browser:', e);
    speakBrowserTTS(text);
  }
}
document.getElementById('hud-voice-btn').addEventListener('click', () => {
  voiceEnabled = !voiceEnabled;
  const btn = document.getElementById('hud-voice-btn');
  btn.classList.toggle('active', voiceEnabled);
  btn.textContent = voiceEnabled ? '🔊' : '🔇';
  if (!voiceEnabled && ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
});

// ── Location Title ──
let lastBgLocation = '';
const bgCache = {};

function setLocation(name) {
  const el = document.getElementById('location-title');
  el.textContent = name;
  el.classList.remove('visible', 'reveal');
  void el.offsetWidth;
  el.classList.add('visible', 'reveal');
  // Switch music based on location
  const lowerName = name.toLowerCase();
  const isHall = lowerName.includes('hall') || lowerName.includes('shop') || lowerName.includes('emporium') || lowerName.includes('bank') || lowerName.includes('pawn');
  switchMusic(isHall ? hallMusic : adventureMusic);
  // Generate background image for new locations
  if (name !== lastBgLocation) {
    lastBgLocation = name;
    generateSceneBg(name);
  }
}

async function generateSceneBg(location) {
  // Map location names to local scene images
  const sceneMap = {
    'The Great Hall': 'scenes/great-hall.jpg',
    "Marcos Cavielli's Weapon Shop": 'scenes/weapon-shop.jpg',
    "Hokas Tokas' Magic Emporium": 'scenes/magic-shop.jpg',
    "Shylock McFenney's Bank": 'scenes/bank.jpg',
    "Sam Slicker's Pawn Shop": 'scenes/pawn-shop.jpg'
  };
  
  if (sceneMap[location]) {
    crossfadeBg(sceneMap[location]);
    return;
  }
  
  // Check local cache
  if (bgCache[location]) {
    crossfadeBg(bgCache[location]);
    return;
  }
  const indicator = document.getElementById('img-generating');
  indicator.classList.add('active');
  try {
    const res = await fetch('/api/scene-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ location }),
    });
    const data = await res.json();
    if (data.url) {
      bgCache[location] = data.url;
      crossfadeBg(data.url);
    }
  } catch (e) { console.error('Scene image error:', e); }
  finally { indicator.classList.remove('active'); }
}

function crossfadeBg(url) {
  const current = document.getElementById('scene-bg');
  const next = document.getElementById('scene-bg-next');
  // Preload
  const img = new Image();
  img.onload = () => {
    next.style.backgroundImage = `url('${url}')`;
    next.style.opacity = '1';
    setTimeout(() => {
      current.style.backgroundImage = `url('${url}')`;
      next.style.opacity = '0';
    }, 1600);
  };
  img.src = url;
}

// Portrait system
const portraitCache = {};
async function showPortrait(name, desc, kind) {
  const frame = document.getElementById('portrait-frame');
  const cacheKey = kind + ':' + name;
  let url = portraitCache[cacheKey];
  if (!url) {
    try {
      const res = await fetch('/api/portrait', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, description: desc, type: kind }),
      });
      const data = await res.json();
      if (data.url) { url = data.url; portraitCache[cacheKey] = url; }
    } catch (e) { console.error('Portrait error:', e); }
  }
  if (url) {
    document.getElementById('portrait-img').src = url;
    document.getElementById('portrait-name').textContent = name;
    document.getElementById('portrait-stats').textContent = kind === 'monster' ? '⚔ Hostile' : '✦ Friendly';
    frame.classList.add('visible');
    // Auto-hide after 20s if no new portrait
    clearTimeout(frame._hideTimer);
    frame._hideTimer = setTimeout(() => frame.classList.remove('visible'), 20000);
  }
}

function hidePortrait() {
  document.getElementById('portrait-frame').classList.remove('visible');
}

// ── Choices ──
const choicesArea = document.getElementById('choices-area');
let pendingChoices = [];
function renderChoices() {
  choicesArea.innerHTML = '';
  if (pendingChoices.length === 0) { choicesArea.classList.remove('visible'); return; }
  for (const text of pendingChoices) {
    const card = document.createElement('div');
    card.className = 'choice-card';
    card.textContent = text;
    card.addEventListener('click', () => {
      choicesArea.classList.remove('visible');
      pendingChoices = [];
      inputEl.value = text;
      sendMessage();
    });
    choicesArea.appendChild(card);
  }
  choicesArea.classList.add('visible');
}

// ── Narrative ──
const scroll = document.getElementById('narrative-scroll');
function addPlayerLine(text) {
  const div = document.createElement('div');
  div.className = 'narrative-line player-line line-enter';
  div.textContent = text;
  scroll.appendChild(div);
  scroll.scrollTop = scroll.scrollHeight;
}

let activeStreamLine = null;
function startStreamLine() {
  activeStreamLine = document.createElement('div');
  activeStreamLine.className = 'narrative-line line-enter';
  const cursor = document.createElement('span');
  cursor.className = 'cursor'; cursor.id = 'stream-cursor';
  activeStreamLine.appendChild(cursor);
  scroll.appendChild(activeStreamLine);
  scroll.scrollTop = scroll.scrollHeight;
}
function appendStreamToken(token) {
  const cursor = document.getElementById('stream-cursor');
  if (cursor) cursor.before(document.createTextNode(token));
  scroll.scrollTop = scroll.scrollHeight;
}
function appendActionText(text) {
  const cursor = document.getElementById('stream-cursor');
  if (!cursor) return;
  const span = document.createElement('span');
  span.className = 'action-highlight';
  span.textContent = text;
  cursor.before(span);
  scroll.scrollTop = scroll.scrollHeight;
}
function finishStreamLine() {
  const cursor = document.getElementById('stream-cursor');
  if (cursor) cursor.remove();
  activeStreamLine = null;
}

// ── Input state ──
const inputEl = document.getElementById('player-input');
const inputBox = document.getElementById('input-box');
const inputLabel = document.getElementById('input-label');
const sendBtn = document.getElementById('send-btn');

const INPUT_SKINS = {
  name:   { placeholder: 'Sign thy name here...', label: '✒ SIGN THE BOOK', skin: 'skin-name', arrow: '✒' },
  choice: { placeholder: 'Choose your path...', label: 'YOUR CHOICE', skin: '', arrow: '›' },
  action: { placeholder: 'What do you do?', label: '', skin: '', arrow: '›' },
  shop:   { placeholder: 'What catches your eye?', label: '⚖ BROWSE THE WARES', skin: 'skin-shop', arrow: '⚖' },
};
function setInputState(hint, enabled) {
  const cfg = INPUT_SKINS[hint] || INPUT_SKINS.action;
  inputEl.placeholder = cfg.placeholder;
  inputLabel.textContent = cfg.label;
  inputLabel.classList.toggle('visible', !!cfg.label);
  document.getElementById('prompt-arrow').textContent = cfg.arrow;
  inputBox.classList.remove('skin-name', 'skin-shop');
  if (cfg.skin) inputBox.classList.add(cfg.skin);
  inputEl.disabled = !enabled;
  sendBtn.disabled = !enabled;
  if (enabled) { inputBox.classList.add('glow', 'pulse'); setTimeout(() => inputEl.focus(), 100); }
  else { inputBox.classList.remove('glow', 'pulse'); }
}

// ── Stream API ──
async function streamMessage(endpoint, body) {
  if (isStreaming) return;
  isStreaming = true;
  setInputState('action', false);
  pendingChoices = [];
  choicesArea.classList.remove('visible');
  document.getElementById('thinking').style.display = 'flex';

  let ttsText = '';
  let doneVoiceId = null;
  let doneInputHint = 'action';

  try {
    const res = await fetch(endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    document.getElementById('thinking').style.display = 'none';
    startStreamLine();

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const evt = JSON.parse(line.slice(6));
          if (evt.type === 'token') { appendStreamToken(evt.text); ttsText += evt.text; }
          if (evt.type === 'action_text') { appendActionText(evt.text); ttsText += evt.text; }
          if (evt.type === 'location') setLocation(evt.text);
          if (evt.type === 'voice') currentVoiceId = evt.voice;
          if (evt.type === 'choice') pendingChoices.push(evt.text);
          if (evt.type === 'input_hint') doneInputHint = evt.hint;
          if (evt.type === 'shop') { if (evt.shop === 'close') closeShop(); else openShop(evt.shop); }
          if (evt.type === 'portrait') showPortrait(evt.name, evt.desc, evt.kind);
          if (evt.type === 'done') {
            finishStreamLine();
            doneVoiceId = evt.voiceId;
            if (evt.phaseUpdate?.character) {
              // Preserve local gold - server doesn't track spending
              const localGold = character.gold;
              character = { ...character, ...evt.phaseUpdate.character };
              if (localGold !== undefined) character.gold = localGold;
              updateHUD(true);
            }
          }
        } catch (_) {}
      }
    }
  } catch (err) {
    document.getElementById('thinking').style.display = 'none';
    addPlayerLine('[Connection error — try refreshing]');
  } finally {
    isStreaming = false;
    renderChoices();
    setInputState(doneInputHint, true);
    if (ttsText.trim() && doneVoiceId) speakElevenLabs(ttsText.trim(), doneVoiceId);
  }
}

// ── Send ──
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isStreaming) return;
  inputEl.value = '';

  if (gamePhase === 'intro') {
    character.name = text.split(' ').slice(0, 3).join(' ');
    document.getElementById('hud-name').textContent = character.name;
    gamePhase = 'named';
  } else if (gamePhase === 'named') {
    gamePhase = 'classed';
  }
  if (gamePhase === 'classed') gamePhase = 'playing';

  addPlayerLine(text);
  await streamMessage('/api/chat', { sessionId: SESSION_ID, message: text });
}

// ── HUD ──
function updateHUD(animate) {
  document.getElementById('hud-name').textContent = character.name || '—';
  const stats = { 'stat-hd': character.hd, 'stat-ag': character.ag, 'stat-ch': character.ch, 'stat-gold': character.gold };
  for (const [id, val] of Object.entries(stats)) {
    const el = document.getElementById(id);
    if (val != null) {
      el.textContent = val;
      if (animate) { el.classList.remove('stat-reveal'); void el.offsetWidth; el.classList.add('stat-reveal'); }
    }
  }
}

// ── Boot ──
document.getElementById('enter-btn').addEventListener('click', async () => {
  document.getElementById('game-screen').classList.add('active');
  startMusic();
  document.getElementById('title-screen').classList.add('fade-out');
  setTimeout(() => document.getElementById('title-screen').style.display = 'none', 1200);
  await streamMessage('/api/start', { sessionId: SESSION_ID });
});

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
